# FoxPrivacy feature manifest
#
# Every setting FoxPrivacy can apply. The installer builds policies.json from
# the features you enable; nothing else in this project decides what ships.
#
# Format, one feature per block, blank line between blocks:
#
#   feature: <id>              lowercase, digits and hyphens only
#   name:    <short label>     shown in the menu
#   summary: <one sentence>    what it does, in plain language
#   cost:    <what you lose>   empty means nothing a user would notice
#   breaks:  <nothing|convenience|sites>
#   presets: <names>           space separated, from: standard strict
#   policy:  <Key> = <value>   a Firefox enterprise policy
#   policy:  <Key>.<Sub> = <value>
#   pref:    <name> = <value> <status>   a preference, via the Preferences policy
#
# Values true and false become JSON booleans, digits become numbers, anything
# else becomes a JSON string. Values may not contain a quote or a backslash.
#
# Policy keys must exist in Firefox's policies-schema.json and preference names
# must match the allowlist in Firefox's Policies.sys.mjs. A key Firefox does not
# recognise is ignored silently, which is why tests/run.sh checks both against
# Firefox's own source on every run.
#
# Preference status is one of: default locked user clear. Use default unless
# there is a reason not to, so a value the user set by hand still wins.
#
# breaks: says what kind of cost it is, because that is what decides which
# profile a setting may appear in:
#
#   nothing      no cost at all; cost: must be empty
#   convenience  you lose a feature, but no website misbehaves
#   sites        real websites break and need a per-site exception
#
# A feature that breaks sites may never be in the standard profile. Losing a
# convenience may be, when what it buys is worth more than what it costs: not
# sending every keystroke to a search engine is worth losing a dropdown.
# tests/run.sh enforces both rules.

feature: telemetry
name: Telemetry and usage data
summary: Stops Firefox collecting and sending usage, performance, and health data to Mozilla.
cost:
breaks: nothing
presets: standard strict
policy: DisableTelemetry = true

feature: studies
name: Studies and experiments
summary: Stops Shield and Normandy silently enabling experimental features on your browser.
cost:
breaks: nothing
presets: standard strict
policy: DisableFirefoxStudies = true

feature: crash-reports
name: Automatic crash reports
summary: Stops crash reports being submitted automatically. The crash reporter still works; it just stops sending without asking.
cost:
breaks: nothing
presets: standard strict
pref: browser.crashReports.unsubmittedCheck.enabled = false default
pref: browser.crashReports.unsubmittedCheck.autoSubmit2 = false default

feature: sponsored-content
name: Sponsored shortcuts and stories
summary: Removes paid placements from the new tab page: sponsored shortcuts, sponsored stories, and Mozilla's promotional snippets.
cost:
breaks: nothing
presets: standard strict
policy: FirefoxHome.SponsoredTopSites = false
policy: FirefoxHome.SponsoredStories = false
policy: FirefoxHome.Snippets = false

feature: firefox-suggest
name: Firefox Suggest online and sponsored results
summary: Stops what you type in the address bar being sent to Mozilla for online suggestions, and removes sponsored results from the dropdown.
cost:
breaks: nothing
presets: standard strict
policy: FirefoxSuggest.WebSuggestions = false
policy: FirefoxSuggest.SponsoredSuggestions = false
policy: FirefoxSuggest.ImproveSuggest = false

feature: in-product-messaging
name: Nags and recommendations
summary: Removes What's New pages, feature and extension recommendations, address bar interventions, More from Mozilla, and the onboarding tour.
cost:
breaks: nothing
presets: standard strict
policy: UserMessaging.WhatsNew = false
policy: UserMessaging.ExtensionRecommendations = false
policy: UserMessaging.FeatureRecommendations = false
policy: UserMessaging.UrlbarInterventions = false
policy: UserMessaging.MoreFromMozilla = false
policy: UserMessaging.FirefoxLabs = false
policy: UserMessaging.SkipOnboarding = true

feature: terms-of-use
name: Terms of use interstitial
summary: Skips the terms of use and data preferences screen newer Firefox versions show on first run.
cost:
breaks: nothing
presets: standard strict
policy: SkipTermsOfUse = true

feature: feedback-commands
name: Feedback menu commands
summary: Removes the Submit Feedback and Report Deceptive Site menu items, which post data to Mozilla and Google.
cost: You cannot report a phishing site from the menu.
breaks: convenience
presets: standard strict
policy: DisableFeedbackCommands = true

feature: default-browser-agent
name: Windows default browser agent
summary: Disables the scheduled Windows task that reports your default browser choice to Mozilla. No effect on Linux or macOS.
cost:
breaks: nothing
presets: standard strict
policy: DisableDefaultBrowserAgent = true

feature: ai-features
name: AI features
summary: Turns off the AI chatbot sidebar, link previews, smart tab groups, and smart windows.
cost:
breaks: nothing
presets: standard strict
policy: GenerativeAI.Chatbot = false
policy: GenerativeAI.LinkPreviews = false
policy: GenerativeAI.TabGroups = false
policy: GenerativeAI.SmartWindow = false
policy: GenerativeAI.Locked = false

feature: network-prediction
name: Link prefetching and speculative connections
summary: Stops Firefox resolving, connecting to, and fetching pages you have not asked for.
cost:
breaks: nothing
presets: standard strict
policy: NetworkPrediction = false
pref: network.prefetch-next = false default

feature: global-privacy-control
name: Global Privacy Control
summary: Sends the Global Privacy Control signal, a legally recognised do-not-sell-my-data request in some jurisdictions.
cost:
breaks: nothing
presets: standard strict
pref: privacy.globalprivacycontrol.enabled = true default

feature: tracking-protection
name: Enhanced Tracking Protection
summary: Keeps tracking protection on and adds cryptominer, fingerprinter, and email tracker blocking. Left unlocked so you can still make a per-site exception.
cost:
breaks: nothing
presets: standard strict
policy: EnableTrackingProtection.Value = true
policy: EnableTrackingProtection.Cryptomining = true
policy: EnableTrackingProtection.Fingerprinting = true
policy: EnableTrackingProtection.EmailTracking = true
policy: EnableTrackingProtection.Locked = false

feature: home-stories
name: Recommended stories on the new tab page
summary: Removes the recommended articles section, not just the sponsored entries in it. That section is fetched from Mozilla every time you open a tab.
cost: The new tab page shows only your own shortcuts.
breaks: convenience
presets: standard strict
policy: FirefoxHome.Stories = false

feature: search-suggestions
name: Search suggestions
summary: Stops every keystroke in the address bar being sent to your search engine before you press Enter. A mistyped password reaches the engine without you ever submitting it.
cost: No suggestion dropdown while typing a search.
breaks: convenience
presets: standard strict
policy: SearchSuggestEnabled = false

feature: captive-portal
name: Captive portal detection
summary: Stops Firefox periodically contacting detectportal.firefox.com to check for a login page.
cost: Public WiFi login pages may not open by themselves. You may have to visit an http site to trigger them.
breaks: sites
presets: strict
policy: CaptivePortal = false

feature: strict-tracking
name: Strict tracking protection
summary: Moves Enhanced Tracking Protection from the standard category to strict.
cost: Some embedded logins, comment widgets, and video players need a per-site exception.
breaks: sites
presets: strict
policy: EnableTrackingProtection.Category = strict

feature: fingerprinting-protection
name: Fingerprinting protection
summary: Enables Firefox's targeted fingerprinting protection, which limits the values scripts can read to identify your machine.
cost: A small number of sites misdetect your browser or screen size.
breaks: sites
presets: strict
pref: privacy.fingerprintingProtection = true default

feature: form-autofill
name: Address and payment card autofill
summary: Turns off storing and autofilling addresses and payment cards.
cost: You type addresses and card numbers by hand. Saved passwords are not affected.
breaks: convenience
presets: strict
policy: AutofillAddressEnabled = false
policy: AutofillCreditCardEnabled = false

feature: urlbar-trending
name: Trending search suggestions
summary: Stops Firefox contacting your search engine the moment you click the address bar, before you have typed anything.
cost: The address bar no longer offers trending searches when you click it.
breaks: convenience
presets: standard strict
pref: browser.urlbar.suggest.trending = false default
pref: browser.urlbar.trending.featureGate = false default

feature: urlbar-speculative-connect
name: Speculative connections from the address bar
summary: Stops Firefox opening a connection to a guessed destination while you are still typing. NetworkPrediction does not cover this one.
cost:
breaks: nothing
presets: standard strict
pref: browser.urlbar.speculativeConnect.enabled = false default

feature: urlbar-single-word-lookup
name: Single word address bar lookups
summary: Stops Firefox turning a single word you type into a www.word.com request before searching for it.
cost: A single word goes to your search engine instead of being tried as a hostname first.
breaks: convenience
presets: standard strict
pref: browser.fixup.alternate.enabled = false default

feature: referrer-trimming
name: Cross site referrer trimming
summary: Sends only the site name, not the full page address, when you follow a link to another site.
cost: A few sites that inspect the full referring URL may misbehave.
breaks: sites
presets: strict
pref: network.http.referer.XOriginTrimmingPolicy = 2 default

feature: webrtc-local-ip
name: WebRTC local address leak
summary: Stops video call code discovering your machine's local network addresses. Calls still work; this is not a WebRTC kill switch.
cost: Some calls take longer to connect, or fail on unusual network setups.
breaks: sites
presets: strict
pref: media.peerconnection.ice.default_address_only = true default

feature: https-only
name: HTTPS only mode
summary: Makes Firefox use HTTPS everywhere and warn before falling back to unencrypted HTTP.
cost: Sites that are still HTTP only show a warning you have to click through.
breaks: sites
presets: strict
policy: HttpsOnlyMode = enabled

feature: remote-improvements
name: Remote feature rollouts
summary: Stops Mozilla switching features on and off in your browser between updates through Nimbus rollouts.
cost:
breaks: nothing
presets: standard strict
policy: DisableRemoteImprovements = true

feature: visual-search
name: Visual search
summary: Turns off visual search, which sends an image from the page to a search provider.
cost: No right click search by image.
breaks: convenience
presets: standard strict
policy: VisualSearchEnabled = false
